[package]
name = "tlsplus-core"
version = "0.3.0"
edition = "2024"
publish = false

[lib]
name = "tlsplus_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32.0", features = ["cli"] }
huginn-net-tls = { version = "2.0.0", features = ["full", "json"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
wreq = { path = "../wreq", default-features = false, features = ["tokio-rt", "stream", "webpki-roots"] }
wreq-util = { path = "../wreq-util", default-features = false, features = ["emulation"] }

hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

hex = "0.4"
md5 = "0.8"

[dev-dependencies]
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
