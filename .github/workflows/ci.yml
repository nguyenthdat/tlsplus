name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GRADLE_VERSION: "9.7.0"
  JAVA_VERSION: "21"
  RUST_TOOLCHAIN: "nightly-2026-08-04"

jobs:
  validate:
    name: Rust and Gradle validation
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build nasm pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          key: ci-linux-x86_64

      - name: Run workspace tests
        run: cargo test --workspace --locked --lib --tests --bins

      - name: Run Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Build Burp extension
        run: gradle build --stacktrace

      - name: Verify Burp jar
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' build.gradle.kts | head -n 1)"
          test -s build/libs/tlsplus-extension.jar
          jar tf build/libs/tlsplus-extension.jar > build/jar-contents.txt
          grep -Fxq 'com/tlsplus/burp/TlsPlusExtension.class' build/jar-contents.txt
          unzip -p build/libs/tlsplus-extension.jar META-INF/MANIFEST.MF | tr -d '\r' | grep -Fqx "Implementation-Version: ${version}"

      - name: Upload CI jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tlsplus-extension-${{ github.sha }}
          path: build/libs/tlsplus-extension.jar
          if-no-files-found: error
          retention-days: 14
