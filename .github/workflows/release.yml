name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GRADLE_VERSION: "9.7.0"
  JAVA_VERSION: "21"
  NPCAP_SDK_SHA256: "52c7b9fb4abee3ad9fe739bb545c3efe77b731c8e127122bdf328eafdae3ed4f"
  RUST_TOOLCHAIN: "nightly-2026-08-04"

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Validate tag, version, and main ancestry
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH: ${tag}" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          rust_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' crates/tlsplus-core/Cargo.toml | head -n 1)"
          gradle_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' build.gradle.kts | head -n 1)"
          if [[ "${rust_version}" != "${version}" || "${gradle_version}" != "${version}" ]]; then
            echo "Tag ${tag}, Rust ${rust_version}, and Gradle ${gradle_version} must match" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]]; then
            echo "Release commit ${GITHUB_SHA} is not the current origin/main tip" >&2
            exit 1
          fi
          if [[ "$(git rev-list -n 1 "${tag}")" != "${GITHUB_SHA}" ]]; then
            echo "Tag ${tag} does not resolve to ${GITHUB_SHA}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  test:
    name: Release validation
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build nasm pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          key: release-validation-linux-x86_64

      - name: Run workspace tests
        run: cargo test --workspace --locked --lib --tests --bins

      - name: Run Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

  native:
    name: Native ${{ matrix.classifier }}
    needs: validate
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - classifier: darwin-aarch64
            runs_on: macos-14
            rust_target: aarch64-apple-darwin
            lib_name: libtlsplus_core.dylib
          - classifier: windows-x86_64
            runs_on: windows-2022
            rust_target: x86_64-pc-windows-msvc
            lib_name: tlsplus_core.dll
            msvc_arch: x64
          - classifier: windows-aarch64
            runs_on: windows-2022
            rust_target: aarch64-pc-windows-msvc
            lib_name: tlsplus_core.dll
            msvc_arch: amd64_arm64
          - classifier: linux-x86_64
            runs_on: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            lib_name: libtlsplus_core.so
          - classifier: linux-aarch64
            runs_on: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            lib_name: libtlsplus_core.so

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Linux native build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build nasm pkg-config

      - name: Install macOS native build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja nasm pkg-config

      - name: Install Windows native build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja nasm -y --no-progress

      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install verified Windows Npcap SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkZip = Join-Path $env:RUNNER_TEMP "npcap-sdk.zip"
          $sdkDir = Join-Path $env:RUNNER_TEMP "npcap-sdk"
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.15.zip" -OutFile $sdkZip
          $actualHash = (Get-FileHash -Algorithm SHA256 $sdkZip).Hash.ToLowerInvariant()
          if ($actualHash -ne "${{ env.NPCAP_SDK_SHA256 }}") {
            throw "Npcap SDK checksum mismatch: $actualHash"
          }
          Expand-Archive -Path $sdkZip -DestinationPath $sdkDir -Force
          $libSubdir = if ("${{ matrix.rust_target }}" -eq "aarch64-pc-windows-msvc") { "ARM64" } else { "x64" }
          $libDir = Join-Path $sdkDir "Lib/$libSubdir"
          if (!(Test-Path (Join-Path $libDir "Packet.lib"))) {
            throw "Packet.lib not found in $libDir"
          }
          "LIB=$libDir;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NPCAP_SDK_LIB_DIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          key: release-${{ matrix.rust_target }}

      - name: Build native library (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path crates/tlsplus-core/Cargo.toml --target "${{ matrix.rust_target }}"
          test -s "target/${{ matrix.rust_target }}/release/${{ matrix.lib_name }}"

      - name: Build native library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --release --manifest-path crates/tlsplus-core/Cargo.toml --target "${{ matrix.rust_target }}"
          $library = "target/${{ matrix.rust_target }}/release/${{ matrix.lib_name }}"
          if (!(Test-Path $library) -or (Get-Item $library).Length -eq 0) {
            throw "Missing native library: $library"
          }

      - name: Stage native artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/native/${{ matrix.classifier }}"
          cp "target/${{ matrix.rust_target }}/release/${{ matrix.lib_name }}" "dist/native/${{ matrix.classifier }}/${{ matrix.lib_name }}"
          file "dist/native/${{ matrix.classifier }}/${{ matrix.lib_name }}"

      - name: Stage native artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/native/${{ matrix.classifier }}" | Out-Null
          Copy-Item "target/${{ matrix.rust_target }}/release/${{ matrix.lib_name }}" "dist/native/${{ matrix.classifier }}/${{ matrix.lib_name }}"

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.classifier }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package all-platform Burp jar
    needs:
      - validate
      - test
      - native
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build nasm pkg-config

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          key: package-linux-x86_64

      - name: Download native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: build/prebuilt-native
          pattern: native-*
          merge-multiple: true

      - name: Verify native bundle
        run: |
          set -euo pipefail
          expected=(
            "native/darwin-aarch64/libtlsplus_core.dylib"
            "native/windows-x86_64/tlsplus_core.dll"
            "native/windows-aarch64/tlsplus_core.dll"
            "native/linux-x86_64/libtlsplus_core.so"
            "native/linux-aarch64/libtlsplus_core.so"
          )
          for entry in "${expected[@]}"; do
            test -s "build/prebuilt-native/${entry}"
          done
          actual_count="$(find build/prebuilt-native/native -type f | wc -l | tr -d ' ')"
          test "${actual_count}" -eq "${#expected[@]}"

      - name: Build all-platform Burp jar
        run: gradle burpJar -Ptlsplus.nativeBundleDir=build/prebuilt-native --stacktrace

      - name: Stage and verify release assets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          jar tf build/libs/tlsplus-extension.jar > dist/jar-contents.txt
          expected=(
            "native/darwin-aarch64/libtlsplus_core.dylib"
            "native/windows-x86_64/tlsplus_core.dll"
            "native/windows-aarch64/tlsplus_core.dll"
            "native/linux-x86_64/libtlsplus_core.so"
            "native/linux-aarch64/libtlsplus_core.so"
          )
          for entry in "${expected[@]}"; do
            grep -Fxq "${entry}" dist/jar-contents.txt
          done
          grep -Fxq 'com/tlsplus/burp/TlsPlusExtension.class' dist/jar-contents.txt
          unzip -p build/libs/tlsplus-extension.jar META-INF/MANIFEST.MF | tr -d '\r' | grep -Fqx "Implementation-Version: ${VERSION}"
          cp build/libs/tlsplus-extension.jar "dist/tlsplus-extension-${VERSION}-all-platforms.jar"
          tar -czf "dist/tlsplus-native-libraries-${VERSION}.tar.gz" -C build/prebuilt-native native
          {
            echo "tag=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "rust=${RUST_TOOLCHAIN}"
            echo "java=${JAVA_VERSION}"
            echo "gradle=${GRADLE_VERSION}"
            echo "targets=aarch64-apple-darwin,x86_64-pc-windows-msvc,aarch64-pc-windows-msvc,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu"
          } > dist/BUILD-PROVENANCE.txt
          (cd dist && shasum -a 256 BUILD-PROVENANCE.txt jar-contents.txt tlsplus-extension-*.jar tlsplus-native-libraries-*.tar.gz > SHA256SUMS)
          (cd dist && shasum -a 256 -c SHA256SUMS)

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tlsplus-release-${{ github.ref_name }}
          path: dist
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs:
      - validate
      - package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tlsplus-release-${{ github.ref_name }}
          path: dist

      - name: Verify release bundle checksums
        run: cd dist && shasum -a 256 -c SHA256SUMS

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --verify-tag \
            --title "TLS+ ${TAG}" \
            --notes-file - <<EOF
          TLS+ ${VERSION}

          Highlights:
          - Added RFC 8441 WebSocket support using HTTP/2 Extended CONNECT.
          - Preserved HTTP/2 across the Burp-to-TLS+ and TLS+-to-backend connections.
          - Kept HTTP/1.1 WebSocket Upgrade, HTTP/1.0, and standard CONNECT compatibility.
          - Added real Burp and controlled backend verification for bidirectional RFC 8441 frames.
          - Made server lifecycle tests use OS-assigned ports for reliable parallel execution.

          See CHANGELOG.md for the complete release summary.
          EOF
