[package]
name = "tlsplus-core"
version = "0.3.0"
edition = "2024"
publish = false

[lib]
name = "tlsplus_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.31.2", features = ["cli"] }
huginn-net-tls = { version = "2.0.0-rc", features = ["full", "json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# TLS fingerprint spoofing — BoringSSL via Cloudflare boring
boring = { version = "5.1", features = [] }
tokio-boring = "5.0"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-boring = "5.0"
http-body-util = "0.1"
bytes = "1"

# Root certificates
webpki-roots = "1"

# Certificate compression — Brotli for Chrome-like ClientHello
brotli = "8"

# Legacy JA4/JA3 computation
hex = "0.4"
md5 = "0.8"
[dev-dependencies]
